<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Trip Planner Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E9ECF1; --surface:#FFFFFF; --soft:#F6F7F9; --line:#E6E8ED;
  --ink:#16181D; --ink2:#575E6E; --ink3:#8B91A1;
  --brand:#FF4F17; --brand-ink:#E0400D; --brand-soft:#FFF0EA;
  --ai:#6346F0; --ai-soft:#F2EFFF; --ai-line:#DCD4FF;
  --ok:#0E9F4F; --ok-soft:#E7F7EE;
  --warn:#B86E00; --warn-soft:#FFF5E2;
  --bad:#D3302A; --bad-soft:#FDECEB;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:32px 16px}
.phone{position:relative;width:390px;height:844px;background:var(--soft);border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #111,0 0 0 11px #333,0 30px 60px rgba(0,0,0,.25);flex-shrink:0}
.notes{width:300px;align-self:center}
.notes .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.notes h3{font-size:18px;margin:6px 0 10px;letter-spacing:-.01em}
.notes p{color:var(--ink2);font-size:13.5px;margin-bottom:10px}
.notes ul{padding-left:18px;color:var(--ink2);font-size:13.5px}
.notes li{margin-bottom:6px}
.notes .disclaimer{margin-top:22px;padding-top:14px;border-top:1px solid #D5D9E0;font-size:12px;color:var(--ink3)}
.notes .restart{margin-top:12px;font-size:13px;font-weight:600;color:var(--ai)}
@media (max-width:820px){.notes{display:none}}
@media (max-width:480px){
  .stage{padding:0}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}

/* ---------- screen scaffolding ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--soft)}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:13px;font-weight:600;background:inherit}
@media (max-width:480px){.statusbar{display:none}}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;flex:1;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--ink3);font-weight:500}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.iconbtn:hover{background:var(--soft)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:16px}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.small{font-size:12px} .tiny{font-size:11px}
.bold{font-weight:700} .semi{font-weight:600}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .1s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-ink)}
.btn-ghost{background:var(--soft);color:var(--ink)}
.btn-ai{background:var(--ai);color:#fff}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.link{color:var(--ai);font-weight:600;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.you{background:var(--brand-soft);color:var(--brand-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.spark{color:var(--ai)}
.sectionlabel{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 8px}

/* ---------- animations ---------- */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%{background:var(--ai-soft)}100%{background:transparent}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.enter{animation:up .35s ease both}
.flash{animation:flash 1.6s ease}
.noanim .enter{animation:none}
.noanim-sheet .sheet,.noanim-sheet .backdrop{animation:none}
.noanim-toast .toast{animation:none}
.capture .stage{padding:0;display:block}
.capture .phone{width:390px;height:844px;border-radius:0;box-shadow:none}
.capture .notes{display:none}
.capture .statusbar{display:flex!important}
.capture *{animation:none!important;transition:none!important}
.capture .scroll{scroll-behavior:auto!important}
.delta{white-space:nowrap}
.sheet .meter .over button{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- home ---------- */
.home-head{background:var(--surface);padding:14px 16px 18px}
.wordmark{font-weight:800;font-size:22px;letter-spacing:-.03em}
.wordmark span{color:var(--brand)}
.concept{font-size:11.5px;font-weight:600;color:var(--ink3);border:1px solid var(--line);padding:2px 7px;border-radius:999px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.tile{background:var(--soft);border-radius:12px;padding:12px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--ink2)}
.tile .ic{font-size:20px;display:block;margin-bottom:4px}
.ai-hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1B1446 0%,#3A23B8 60%,#6346F0 100%);color:#fff;text-align:left;width:100%}
.ai-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,23,.55),transparent 70%)}
.ai-hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.ai-hero h2{font-size:21px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.02em;max-width:260px}
.ai-hero p{font-size:13px;opacity:.85;max-width:270px}
.ai-hero .go{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:9px 14px;border-radius:999px}
.offer{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.offer::-webkit-scrollbar{display:none}
.offer .o{min-width:200px;height:96px;border-radius:14px;padding:12px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:flex-end}

/* ---------- compose ---------- */
.compose-hello{padding:28px 20px 8px}
.compose-hello .orb{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 200deg,#6346F0,#FF4F17,#FFB36B,#6346F0);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 20px rgba(99,70,240,.35)}
.compose-hello h2{font-size:24px;letter-spacing:-.02em;margin-top:14px;line-height:1.2}
.compose-hello p{color:var(--ink2);margin-top:6px}
.suggest{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px;transition:border-color .15s,transform .1s}
.suggest:hover{border-color:var(--ai-line)}
.suggest:active{transform:scale(.99)}
.suggest .k{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.suggest .t{font-weight:600;margin-top:3px}
.suggest.dim{opacity:.55}
.composer{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px 14px}
.composer .box{display:flex;align-items:flex-end;gap:8px;background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:8px 8px 8px 14px;transition:border-color .15s}
.composer .box:focus-within{border-color:var(--ai)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;font:inherit;outline:none;max-height:110px;min-height:22px;padding:5px 0}
.composer .send{width:38px;height:38px;border-radius:12px;background:var(--ai);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:opacity .15s}
.composer .send:disabled{opacity:.3;cursor:default}
.composer .tools{display:flex;gap:6px;margin-top:8px}
.composer .tools button{font-size:12px;font-weight:600;color:var(--ink2);background:var(--soft);padding:6px 10px;border-radius:999px}

/* ---------- thinking ---------- */
.bubble-user{align-self:flex-end;max-width:85%;background:var(--ink);color:#fff;padding:11px 14px;border-radius:18px 18px 4px 18px;font-size:14px}
.think{margin-top:18px}
.think .head{display:flex;align-items:center;gap:8px;font-weight:600}
.think .dot{width:8px;height:8px;border-radius:50%;background:var(--ai);animation:pulse 1s infinite}
.step{display:flex;gap:10px;padding:9px 0;animation:up .3s ease both}
.step .mark{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px;margin-top:1px}
.step .mark.done{background:var(--ok-soft);color:var(--ok)}
.step .mark.run{border:2px solid var(--ai-line);border-top-color:var(--ai);animation:spin .8s linear infinite}
.step .txt{font-size:13.5px}
.step .txt b{font-weight:600}
.funnel{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.funnel span{font-size:11px;font-weight:600;background:var(--ai-soft);color:var(--ai);padding:3px 7px;border-radius:6px}
.skeleton{height:84px;border-radius:14px;background:linear-gradient(90deg,#eceef2 0%,#f7f8fa 50%,#eceef2 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;margin-top:10px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- plan ---------- */
.brief{background:var(--surface);padding:14px 16px 16px;border-bottom:1px solid var(--line)}
.brief .lbl{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.brief .sentence{font-size:17px;line-height:2.05;font-weight:500;letter-spacing:-.01em;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 9px;border-radius:9px;background:var(--ai-soft);color:var(--ai);font-weight:600;border-bottom:1.5px dashed var(--ai-line);transition:background .15s,transform .1s;line-height:1.6}
.chip:hover{background:#E8E2FF}
.chip:active{transform:scale(.97)}
.chip.you{background:var(--brand-soft);color:var(--brand-ink);border-bottom-color:#FFC9B5}
.chip .caret{font-size:9px;opacity:.7}
.meter{margin-top:12px}
.meter .bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;position:relative}
.meter .fill{height:100%;border-radius:999px;background:var(--ok);transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.meter .fill.over{background:var(--bad)}
.meter .txt{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;color:var(--ink2)}
.meter .txt b{color:var(--ink)}
.meter .txt .over{color:var(--bad);font-weight:700}

.assume .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.assume .item:first-of-type{border-top:0}
.toggle{width:38px;height:22px;border-radius:999px;background:#D7DAE0;position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--ai)}
.toggle.on::after{transform:translateX(16px)}

.qcard{border:1.5px solid var(--ai-line);background:linear-gradient(180deg,#FBFAFF,#fff)}
.q{margin-top:12px}
.q .qt{font-weight:600;font-size:13.5px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;text-align:left;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ai-line)}
.opt .d{display:block;font-size:11px;font-weight:500;color:var(--ink3)}
.opt.sel{border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}

.booking-card .head{display:flex;align-items:center;gap:8px}
.booking-card .kind{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;flex:1;display:flex;align-items:center;gap:6px}
.lockbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);transition:background .15s,color .15s}
.lockbtn:hover{background:var(--soft)}
.lockbtn.on{color:var(--brand-ink);background:var(--brand-soft)}
.flight-line{display:flex;align-items:center;gap:10px;margin-top:10px}
.flight-line .time{font-weight:700;font-size:16px}
.flight-line .path{flex:1;height:1px;background:var(--line);position:relative}
.flight-line .path::after{content:"✈";position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:12px;color:var(--ink3);background:#fff;padding:0 4px}
.why{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 10px;background:var(--ai-soft);border-radius:10px;font-size:12.5px;color:#3A2A9E}
.why .spark{flex-shrink:0}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions .btn-sm{flex:1;background:var(--soft);font-weight:600}
.hotel-img{height:120px;border-radius:12px;margin-top:10px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:#fff}
.hotel-img .ph{position:absolute;inset:0;display:grid;grid-template-columns:2fr 1fr;gap:3px}
.hotel-img .ph div{background-size:cover}
.hotel-img .cap{position:relative;font-size:11px;font-weight:700;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.quote{margin-top:10px;font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}

.day{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-top:10px}
.day .dh{display:flex;align-items:baseline;gap:8px}
.day .dn{font-weight:800;font-size:15px}
.day .dt{font-size:12px;color:var(--ink3)}
.day .dtitle{font-size:12.5px;color:var(--ink2);margin-left:auto;font-weight:600}
.slot{display:flex;gap:12px;padding:9px 0;border-top:1px dashed var(--line);align-items:flex-start}
.slot:first-of-type{border-top:0}
.slot .tm{width:42px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--ink3);padding-top:1px}
.slot .what{flex:1;font-size:13.5px}
.slot.nap .what{color:var(--ink3);font-style:italic}
.flag{margin-top:8px;background:var(--warn-soft);border-radius:10px;padding:9px 10px;font-size:12.5px;color:#7A4A00}
.flag .row{margin-top:8px}
.flag .btn-sm{background:#fff;color:#7A4A00;border:1px solid #F1D9A6;font-weight:700}
.family-note{border:1.5px solid #CDEBD9;background:#F6FCF8}
.travel{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:500}
.famline{font-size:12px;color:#1F6B43;background:#F1FAF5;border-radius:8px;padding:6px 8px;margin-top:6px}
.fambox{margin-top:10px;background:#F1FAF5;border:1px solid #D6EFE1;border-radius:12px;padding:10px 12px}
.fambox .fh{font-weight:700;font-size:12.5px;color:#1F6B43}
.fambox .fr2{font-size:12.5px;color:var(--ink);margin-top:8px}
.fambox .who{font-size:11px;font-weight:700;color:#3C8A60;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.avail{margin-top:8px;font-size:12px;font-weight:600;color:var(--warn)}
.goodtoknow .gk{display:flex;gap:10px;font-size:13px;color:var(--ink2);margin-top:10px}
.goodtoknow .gk span{flex-shrink:0}

.cmdbar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px 12px}
.cmdchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.cmdchips::-webkit-scrollbar{display:none}
.cmdchips button{white-space:nowrap;font-size:12px;font-weight:600;border:1px solid var(--ai-line);color:var(--ai);background:#fff;border-radius:999px;padding:6px 11px}
.cmdrow{display:flex;gap:8px;align-items:center}
.cmdrow .in{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 6px 0 12px;height:44px;border:1.5px solid transparent}
.cmdrow .in:focus-within{border-color:var(--ai)}
.cmdrow input{flex:1;border:0;background:transparent;outline:none;font-size:13.5px}
.cmdrow .total{text-align:right;line-height:1.1}
.cmdrow .total b{font-size:15px}
.cmdrow .btn{height:44px;padding:0 14px;font-size:14px}

/* ---------- sheets ---------- */
.backdrop{position:absolute;inset:0;background:rgba(15,17,23,.45);animation:fade .2s ease;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;animation:sheet .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:#D7DAE0;margin:8px auto 2px}
.sheet .sh{padding:10px 18px 4px;display:flex;align-items:flex-start;gap:10px}
.sheet .sh h3{font-size:18px;letter-spacing:-.01em;flex:1}
.sheet .sb{padding:6px 18px 18px;overflow-y:auto}
.sheet .sf{padding:12px 18px 18px;border-top:1px solid var(--line)}
.alt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;transition:border-color .15s,background .15s}
.alt:hover{border-color:var(--ai-line)}
.alt.cur{border-color:var(--ai);background:#FBFAFF}
.alt .delta{font-weight:700;font-size:13px}
.delta.neg{color:var(--ok)} .delta.pos{color:var(--bad)}
.fixopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;transition:border-color .15s,background .15s}
.fixopt .box{width:22px;height:22px;border-radius:7px;border:2px solid #CDD1D9;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:12px;margin-top:1px;transition:all .15s}
.fixopt.on{border-color:var(--ai);background:#FBFAFF}
.fixopt.on .box{background:var(--ai);border-color:var(--ai)}
.fixopt.disabled{opacity:.5;cursor:not-allowed}
.funnel-v{margin-top:6px}
.funnel-v .fr{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px}
.funnel-v .fb{height:22px;border-radius:6px;background:var(--ai-soft);display:flex;align-items:center;padding-left:8px;font-weight:700;color:var(--ai);font-size:12px}
.wa{background:#E7DDD3;border-radius:14px;padding:14px;margin-top:6px}
.wa .msg{background:#DCF8C6;border-radius:10px 10px 2px 10px;padding:10px 12px;font-size:13px;margin-left:30px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.wa .prev{background:#fff;border-radius:8px;overflow:hidden;margin-bottom:8px}
.wa .prev .im{height:70px;background:linear-gradient(135deg,#7FD1C7,#2E8B9A);display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;font-size:12px}
.wa .prev .tx{padding:7px 9px;font-size:11.5px;color:var(--ink2)}


/* ---------- family room ---------- */
.mark{display:inline-block;vertical-align:-2px;flex-shrink:0}
.av{border-radius:50%;background:#FFF1EA;object-fit:cover;flex-shrink:0;vertical-align:middle}
.avstack{display:flex}.avstack .av{margin-left:-7px;border:2px solid #fff;background:#FFF1EA}.avstack .av:first-child{margin-left:0}
.board{background:#FFFBF0;border-bottom:1px solid #F3E6C4;padding:10px 14px;flex-shrink:0}
.wishes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wish{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #F0DFB4;border-radius:999px;padding:3px 9px 3px 3px;font-size:12px;font-weight:600}
.wish.wait{padding:3px 9px;color:var(--ink3);font-weight:500;border-style:dashed}
.chat{padding:12px 12px 6px;background:#F3F4F7}
.sysmsg{text-align:center;font-size:11.5px;color:var(--ink3);margin:8px 0;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.sysmsg b{color:var(--ink2)}
.fmsg{display:flex;gap:8px;align-items:flex-end;margin:10px 0}
.fb{background:#fff;border-radius:16px 16px 16px 4px;padding:9px 12px;max-width:78%;font-size:13.5px;box-shadow:var(--shadow)}
.who{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:2px}
.cmsg{display:flex;gap:8px;align-items:flex-start;margin:10px 0}
.cav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FF4F17,#6346F0);display:grid;place-items:center;flex-shrink:0}
.cb{background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:13.5px;max-width:84%;color:#2B1F7A}
.cb .who{color:var(--ai)}
.pincard{background:#fff;border-radius:10px;padding:9px 10px;margin-top:8px;color:var(--ink)}
.notechip{display:flex;gap:6px;align-items:flex-start;margin:6px 0 6px 38px;font-size:12px;font-weight:600;color:var(--ai);background:#fff;border:1px dashed var(--ai-line);border-radius:10px;padding:6px 9px}
.reel{margin-top:7px;border-radius:10px;height:92px;background:linear-gradient(135deg,#FFB38A,#E3644B 55%,#8FD3F4);display:flex;flex-direction:column;justify-content:space-between;padding:8px;color:#fff;font-size:11px}
.reel span{font-weight:700;background:rgba(0,0,0,.35);align-self:flex-start;padding:2px 6px;border-radius:6px}
.voice{display:flex;align-items:center;gap:3px;margin:2px 0 4px}.voice span{font-size:11px;color:var(--brand)}.voice i{display:block;width:3px;border-radius:2px;background:var(--brand);height:8px}.voice i:nth-child(odd){height:16px}.voice i:nth-child(3n){height:22px}.voice em{font-style:normal;font-size:11px;color:var(--ink3);margin-left:6px}
.pollopt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ai-line);border-radius:12px;padding:9px 10px;margin-top:8px;color:var(--ink);transition:border-color .15s}
.pollopt:hover{border-color:var(--ai)}.pollopt.sel{border-color:var(--ai);background:#FBFAFF}
.voters{display:flex;gap:3px;margin-top:6px}
.sumrow{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:6px;color:var(--ink)}
.typing{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin:8px 0 4px}
.dots{display:inline-flex;gap:2px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink3);animation:pulse 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.fortag{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:700;color:#9A4A12;background:#FFF1E6;border-radius:999px;padding:2px 8px 2px 3px}
.fortag .av{border:1.5px solid #fff;margin-left:-4px}.fortag .av:first-child{margin-left:0}
.roomcard{border:1.5px solid #F0DFB4;background:#FFFCF4}
.joinbanner{background:#16181D;color:#fff;font-size:12px;font-weight:600;text-align:center;padding:8px}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.pick{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.chat > .sysmsg:last-of-type,.chat > div:last-child{animation:up .35s ease both}
.pick.sel{border-color:var(--brand);background:var(--brand-soft)}


/* ---------- v2 guided (assistant mode) ---------- */
.gscreen{background:#0B0B12;color:#F2F2F7;overflow:hidden}
.gscreen .statusbar.gsb{background:transparent;color:#fff}
.gscreen.light .scroll{background:#0B0B12}
.ghead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;position:relative;z-index:3}
.iconbtn.g{color:#C9C9D6}.iconbtn.g:hover{background:rgba(255,255,255,.08)}
.gbrand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;color:#fff}
.gbody{display:flex;flex-direction:column;padding:8px 20px 20px;position:relative;z-index:2}
.gglow{position:absolute;left:50%;bottom:-170px;width:520px;height:340px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,181,71,.9),rgba(255,79,23,.75) 35%,rgba(194,59,184,.55) 62%,rgba(110,59,245,.0) 100%);filter:blur(28px);opacity:.75;z-index:1;transition:all .6s ease;pointer-events:none;animation:gbreathe 4s ease-in-out infinite}
.gglow.big{bottom:-60px;height:460px;opacity:1}
@keyframes gbreathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
.gwel{margin-top:40px;text-align:left}
.gorb{width:76px;height:76px;border-radius:26px;background:linear-gradient(135deg,#FFB547,#FF4F17 45%,#C23BB8 80%,#6E3BF5);display:grid;place-items:center;box-shadow:0 18px 50px rgba(255,79,23,.45)}
.ghello{font-size:38px;line-height:1.12;font-weight:700;letter-spacing:-.03em;margin-top:26px}
.ggrad{background:linear-gradient(90deg,#FFB547,#FF4F17,#C23BB8,#8B5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.gp{color:#B5B5C3;font-size:16px;margin-top:14px;line-height:1.5}
.gtags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.gtags span{font-size:12px;font-weight:600;color:#D8D8E4;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:7px 11px;border-radius:999px}
.gdock{position:relative;z-index:3;padding:10px 16px 18px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.gstart{width:100%;height:54px;border-radius:16px;background:#fff;color:#16181D;font-size:16px}
.gtypelink{color:#C9C9D6;font-size:13px}
.gdockrow{display:flex;align-items:center;justify-content:space-between;width:100%}
.gside{display:flex;flex-direction:column;align-items:center;gap:3px;color:#E0E0EA;font-size:18px;width:64px}.gside span{font-size:11px;font-weight:600;color:#A9A9B8}
.gmic{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 10px 30px rgba(255,79,23,.45);transition:transform .2s}
.gmic:active{transform:scale(.95)}.gmic.on{animation:gpulse 1.1s infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 0 0 rgba(255,107,61,.5)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.12),0 0 0 18px rgba(255,107,61,0)}}
.gtype{display:flex;gap:8px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 6px 6px 14px}
.gtype input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:15px}.gtype button{width:38px;height:38px;border-radius:10px;background:#FF4F17;color:#fff;display:grid;place-items:center}
.gprog{display:flex;align-items:center;gap:5px;padding:4px 20px 0;position:relative;z-index:3}.gprog i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.12)}.gprog i.d{background:#FF6B3D}.gprog i.c{background:linear-gradient(90deg,#FF6B3D,#C23BB8)}.gprog span{font-size:11px;color:#B0B0BE;margin-left:6px;font-weight:600;white-space:nowrap}
.gq{margin:18px 0 20px}.gqmark{width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin-bottom:12px}
.gq h2{font-size:27px;line-height:1.18;font-weight:700;letter-spacing:-.02em;animation:up .35s ease both}
.gwho{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gperson{position:relative;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#E8E8F0;font-size:12.5px;font-weight:600;transition:all .15s}
.gperson .av{background:rgba(255,255,255,.08)}.gperson.on{border-color:#FF6B3D;background:rgba(255,107,61,.12)}.gperson i{position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:50%;background:#FF6B3D;color:#fff;font-size:11.5px;font-style:normal;display:grid;place-items:center}
.gperson.add{justify-content:center;font-size:26px;color:#B0B0BE;border-style:dashed}.gperson.add span{font-size:12px}
.gcta{width:100%;height:52px;margin-top:18px;border-radius:16px;background:linear-gradient(90deg,#FF4F17,#E0368C);color:#fff}.gcta.sm{width:auto;height:46px;margin:0;padding:0 18px;font-size:14px}
.gdest{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gpic{position:relative;height:150px;border-radius:20px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;border:2px solid transparent;overflow:hidden}
.gpic::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.7))}.gpic span{position:relative;color:#fff;font-weight:700;font-size:17px}.gpic.on{border-color:#FF6B3D;box-shadow:0 0 0 3px rgba(255,107,61,.3)}
.gpic i,.gtile i{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#FF6B3D;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;z-index:2}
.gchip{margin-top:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:11px 16px;font-weight:600;font-size:14px}.gchip.wide{width:100%}
.gopts{display:flex;flex-direction:column;gap:10px}.gopt{display:flex;align-items:center;justify-content:space-between;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:18px;padding:15px 16px;color:#fff}
.gopt b{display:block;font-size:16px}.gopt span{font-size:12.5px;color:#A9A9B8}.gopt em{font-style:normal;font-size:11.5px;font-weight:700;color:#FFB547;background:rgba(255,181,71,.12);padding:4px 8px;border-radius:8px}.gopt.on{border-color:#FF6B3D;background:rgba(255,107,61,.12)}
.gnote{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:#A9A9B8}
.gbudget{display:flex;gap:10px}.gbub{flex:1;aspect-ratio:1/1.1;border-radius:22px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff}
.gbub b{font-size:22px;letter-spacing:-.02em}.gbub span{font-size:12px;color:#A9A9B8}.gbub.on{border-color:#FF6B3D;background:linear-gradient(160deg,rgba(255,107,61,.25),rgba(194,59,184,.18))}
.gpace{display:flex;flex-direction:column;gap:10px}.gpacec{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;color:#fff}
.gpacec .e{grid-row:1/3;font-size:28px;display:grid;place-items:center}.gpacec b{font-size:16px}.gpacec span:last-child{font-size:12.5px;color:#A9A9B8}.gpacec.on{border-color:#FF6B3D;background:rgba(255,107,61,.12)}
.gtip{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:#FFD9C7;background:rgba(255,107,61,.1);border:1px solid rgba(255,107,61,.25);border-radius:12px;padding:9px 11px;margin-bottom:12px}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gtile{text-align:left;color:#fff}.gtile .im{position:relative;aspect-ratio:1/1;border-radius:16px;background-size:cover;background-position:center;border:2px solid transparent;transition:all .15s}
.gtile.on .im{border-color:#FF6B3D;box-shadow:0 0 0 3px rgba(255,107,61,.3);transform:scale(.97)}.gtile b{display:block;font-size:12.5px;margin-top:6px;line-height:1.2}.gtile span{font-size:11.5px;color:#A9A9B8}
.gpickbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:10px 0 4px;background:linear-gradient(180deg,rgba(11,11,18,0),#0B0B12 40%)}.gpickbar span{font-weight:700;color:#FFB547}
.glisten{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:30px}
.gwave{display:flex;align-items:center;gap:4px;height:50px}.gwave i{width:4px;border-radius:4px;background:linear-gradient(#FFB547,#FF4F17);animation:gw 0.9s ease-in-out infinite}
.gwave i:nth-child(odd){animation-delay:.15s}.gwave i:nth-child(3n){animation-delay:.3s}.gwave i:nth-child(4n){animation-delay:.45s}
@keyframes gw{0%,100%{height:8px}50%{height:44px}}
.gtrans{font-size:22px;font-weight:600;text-align:center;line-height:1.35;min-height:60px}.gtrans .caret{color:#FF6B3D;animation:pulse 1s infinite}
.greact{display:flex;gap:9px;align-items:flex-start;margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:14.5px;line-height:1.45;animation:up .35s ease both}
.gstack{position:relative;width:200px;height:180px;margin:0 auto 26px}
.gpol{position:absolute;left:30px;top:10px;width:140px;height:150px;border-radius:14px;background-size:cover;background-position:center;border:5px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.5);transform:rotate(var(--r));animation:pop .5s ease both;animation-delay:var(--d)}
.gbt{font-size:24px;font-weight:700;letter-spacing:-.02em}
.gsteps{margin-top:18px;display:flex;flex-direction:column;gap:10px;text-align:left}.gsteps div{display:flex;align-items:center;gap:10px;font-size:14px;color:#7C7C8C}.gsteps div.d{color:#E8E8F0}.gsteps div.c{color:#fff}
.gsteps span{width:20px;height:20px;border-radius:50%;border:2px solid #3A3A48;display:grid;place-items:center;font-size:11px}.gsteps .d span{background:#34D399;border-color:#34D399;color:#0B0B12}.gsteps .c span{border-color:#FF6B3D;border-top-color:transparent;animation:spin .8s linear infinite}
.ghero{height:250px;margin:4px 14px 0;border-radius:24px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;position:relative}
.gchipline{position:absolute;top:12px;left:12px}.gchipline span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);padding:5px 10px;border-radius:999px}
.ghtitle{font-size:30px;font-weight:800;letter-spacing:-.03em}.ghmeta{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px;color:#E8E8F0}.ghmeta .avstack .av{border-color:rgba(11,11,18,.6)}
.gsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 14px 0}.gsum div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 10px}.gsum b{display:block;font-size:16px;color:#fff}.gsum span{font-size:11.5px;color:#B0B0BE}
.gsec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 16px 9px;font-size:16px;font-weight:700;color:#fff}.gsec span{font-size:12px;color:#A9A9B8;font-weight:500}

.gdays{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x mandatory}.gdays::-webkit-scrollbar{display:none}
.gday{flex:0 0 150px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:6px 6px 10px;color:#fff;scroll-snap-align:start}
.gday .im{height:96px;border-radius:13px;background-size:cover;background-position:center;position:relative}.gday em{position:absolute;top:6px;left:6px;font-style:normal;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:7px}
.gday b{display:block;font-size:12px;color:#FFB547;margin:8px 4px 0}.gday span{display:block;font-size:13.5px;font-weight:600;margin:1px 4px 0;line-height:1.25}.gday i{display:block;font-style:normal;font-size:11px;color:#B0B0BE;margin:6px 4px 0}
.gswap{display:flex;gap:10px;margin:16px 14px 0;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(255,107,61,.14),rgba(110,59,245,.14));border:1px solid rgba(255,107,61,.3)}
.gswap b{display:block;color:#fff;font-size:14px}.gswap span{font-size:12.5px;color:#D6D2E6;line-height:1.4}.gok{background:#fff;color:#16181D}.gno{background:rgba(255,255,255,.1);color:#fff}
.gstay{display:flex;gap:10px;margin:0 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:8px}.gstay .im{width:84px;height:84px;border-radius:13px;background-size:cover;background-position:center;flex-shrink:0}
.gstay b{display:block;color:#fff;font-size:14.5px;margin-top:4px}.gstay span{display:block;font-size:12px;color:#A9A9B8;margin-top:2px}.gstay em{display:block;font-style:normal;font-size:11.5px;color:#7FE0B5;margin-top:6px}
.gflight{display:flex;align-items:center;gap:10px;margin:8px 14px 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 12px;color:#fff}.gflight div{flex:1}.gflight b{display:block;font-size:13.5px}.gflight span{font-size:12px;color:#A9A9B8}.gflight em{font-style:normal;font-size:11px;font-weight:700;color:#7FE0B5}
.gctas{display:flex;flex-direction:column;gap:8px;margin:18px 14px 0}.gghost{background:rgba(255,255,255,.08);color:#fff;font-size:14px}


.gppl{display:flex;flex-direction:column;gap:8px}
.gpc{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:9px 12px;animation:up .3s ease both}
.gpc .av{background:rgba(255,255,255,.1)}.gpcx{flex:1}.gpcx b{display:block;font-size:15px}.gpcx span{font-size:12px;color:#A9A9B8}.gpcx em{display:block;font-style:normal;font-size:11px;color:#FFB547;margin-top:2px}
.gpdel{width:28px;height:28px;border-radius:50%;color:#B0B0BE;background:rgba(255,255,255,.06);font-size:12px}
.gquick{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:14px}.gquick>span{font-size:12px;color:#B0B0BE;font-weight:600;margin-right:2px}.gquick .gchip{margin:0;padding:8px 12px;font-size:13px}
.gcta:disabled{opacity:.4;cursor:default}
.gsearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:0 12px;height:46px;margin-bottom:12px}.gsearch input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:15px}
.gpic{height:128px}.gpic span{display:flex;flex-direction:column;line-height:1.15}.gpic small{font-size:11px;font-weight:500;opacity:.85}
.gcal{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px;margin-top:10px;animation:up .3s ease both}
.gcalh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.gcalh b{font-size:15px}.gcalh span{font-size:11px;color:#FFB547}
.gcalg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.gcalg i{font-style:normal;text-align:center;font-size:11px;color:#7C7C8C}
.gd{height:36px;border-radius:10px;color:#E8E8F0;font-size:13px;font-weight:600;position:relative}.gd.hol{color:#FFD2A6}.gd.xmas::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#34D399}
.gd.in{background:rgba(255,107,61,.25);color:#fff}.gd.end{background:#FF6B3D;color:#fff}

.rv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}

.bk{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}

const R = {};
function render(){
  const ph = document.getElementById('phone');
  const prevScroll = ph.querySelector('.scroll')?.scrollTop || 0;
  const map = {gelder:vGElder, gpay:vGPay, gtrip:vGTrip, gplan:vGPlan, pchat:vPChat, gwelcome:vGWelcome, gq:vGQ, gbuild:vGBuild, gresult:vGResult, home:vHome, compose:vCompose, thinking:vThinking, plan:vPlanToClario, review:vReview, booking:vBooking, done:vDone, room:vRoom, join:vJoin};
  ph.innerHTML = map[S.screen]() + (S.sheet ? vSheet() : '') + (S.toast ? vToast() : '');
  // only animate things that are new since the last render
  ph.classList.toggle('noanim', R.screen === S.screen);
  ph.classList.toggle('noanim-sheet', !!S.sheet && R.sheet === S.sheet);
  ph.classList.toggle('noanim-toast', !!S.toast && R.toast === S.toast);
  R.screen = S.screen; R.sheet = S.sheet; R.toast = S.toast;
  const sc = ph.querySelector('.scroll');
  if (sc && S._keepScroll) sc.scrollTop = prevScroll;
  if (sc && S._roomScroll) { sc.scrollTop = sc.scrollHeight; S._roomScroll=false; }
  S._keepScroll = false;
  if (S.highlight){
    const el = ph.querySelector(`[data-h="${S.highlight}"]`);
    if (el){ el.classList.add('flash'); }
    S.highlight = null;
  }
  vNotes();
}

  R.push({t:'summary'}); ROOM=R; }

          if (i === S.bookStep) { st = S.sheet==='price' ? 'hold' : 'run'; ic = S.sheet==='price' ? '!' : ''; }
          if (i===1 && S.hotelHeld && S.bookStep>1){ st='hold'; ic='⏸'; }
          return `<div class="bk"><div class="st ${st}">${ic}</div><div style="flex:1"><div class="semi">${it.k}</div><div class="small muted">${
            i===1 && S.hotelHeld && S.bookStep>1 ? 'On hold: watching price for 20 min' :
            i < S.bookStep ? (i===0?'Confirmed · PNR 6E-QX7K2P':'Confirmed') : i===S.bookStep ? (S.sheet==='price'?'Needs your OK':'Confirming…') : it.d}</div></div></div>`;
        }).join('')}
      </div>
      <div class="small faint mt12" style="text-align:center">Please keep this screen open. It takes about 20 seconds.</div>
    </div>
  </div>`;
}

    const curP = isH ? hotelPrice() : F().price;
    head = isH ? 'Other stays I considered' : 'Other flights I considered';
    body = `<div class="small muted">Only this part changes. The rest of your plan stays as it is.</div>` + Object.values(list).map(o => {
      const d = (isH && o.id==='h1' ? o.price + S.priceBump : o.price) - curP;
      return `<button class="alt ${o.id===cur?'cur':''}" data-a="pick" data-v="${o.id}">
        <div class="row between"><div class="semi">${isH?o.name:o.air+' · '+o.out[0]+' → '+o.out[1]}</div>

        <div class="small muted mt4">${isH?o.area+' · ★ '+o.rating:'Return '+o.ret[0]}</div>

    }).join('');

  if (k==='why-hotel'){

    body = `<div class="small muted">North Goa · 4 nights · 2 connecting rooms</div>

}

/* =========================================================
   ACTIONS
   ========================================================= */
function toast(m, s, undoSnap){
  S.toast = {m, s, undo: undoSnap || null};
  clearTimeout(window._tt);
  window._tt = setTimeout(() => { S.toast = null; keep(); render(); }, undoSnap ? 5000 : 2600);
}
const snap = () => JSON.stringify({flight:S.flight, hotel:S.hotel, dudhsagar:S.dudhsagar, cruise:S.cruise, budget:S.budget, you:S.you, assume:S.assume, momApplied:S.momApplied, momNote:S.momNote});
function deltaMsg(before){ const d = total() - before; return d === 0 ? 'Total unchanged' : `Total ${d<0?'−':'+'}${inr(d)} · now ${inr(total())}`; }

function startThinking(){
  S.screen='thinking'; S.thinkStep=0; render();
  [900,1900,3000,3900,4800].forEach((ms,i)=> later(()=>{ S.thinkStep=i+1; render(); }, ms));
  later(()=>{ S.screen='plan'; render(); document.querySelector('.scroll')?.scrollTo(0,0); }, 5800);
}
function startBooking(){
  S.screen='booking'; S.bookStep=0; S.sheet=null; render();
  later(()=>{ S.bookStep=1; render(); }, 1400);
  later(()=>{ if (S.hotel==='h1' && !S.priceBump) { S.sheet='price'; render(); } else continueBooking(); }, 2700);
}
function continueBooking(){
  later(()=>{ S.bookStep=2; render(); }, 900);
  later(()=>{ S.bookStep=3; render(); }, 2000);
  later(()=>{ S.screen='done'; S.booked=true; S.shared=true; render(); }, 2800);
}

const A = {
  goHome(){ S.screen='home'; render(); },
  goCompose(){ clearTimers(); S.screen='compose'; render(); setTimeout(()=>document.getElementById('draft')?.focus(),50); },
  goPlan(){ S.screen='plan'; render(); },
  goReview(){ S.screen='review'; render(); },
  useSuggest(){ S.draft = PROMPT; render(); const ta=document.getElementById('draft'); if(ta){ta.focus(); autoGrow(ta);} },
  notInProto(){ toast('This prototype follows one journey', 'Try the family trip to Goa'); keep(); render(); },
  soon(v){ toast(`${v}: not in this prototype`, 'It’s in the next iteration'); keep(); render(); },
  send(){ if(!S.draft.trim()) return; startThinking(); },
  chip(v){
    if (v==='budget') S.sheet='budget';
    else if (v==='pace') S.sheet='pace';
    else if (v==='dates'){ S.qSkipped=false; S.dates=null; S.you.dates=false; toast('Pick your dates in the card below'); }
    else toast(`Changing “${v}” would re-plan the trip`, 'Not wired up in this prototype; try budget or dates');
    keep(); render();
  },
  setBudget(v){
    const b = +v; S.budget=b; S.you.budget = b!==120000; S.highlight='meter';
    if (total() > b){ S.sheet='fix'; } else { S.sheet=null; toast(b===120000?'Budget back to ₹1.2L':'Budget updated', total()<=b?`${inr(b-total())} left`:''); }
    keep(); render();
  },
  openFix(){ S.sheet='fix'; keep(); render(); },
  fixToggle(v){
    if (v==='flight'){ S.flight = S.flight==='f2'?'f1':'f2'; S.you.flight = S.flight!=='f1'; }
    if (v==='hotel'){ S.hotel = S.hotel==='h2'?'h1':'h2'; S.you.hotel = S.hotel!=='h1'; }
    if (v==='day3'){ S.dudhsagar = !S.dudhsagar; }
    keep(); render();
  },
  lockedMsg(){ toast('That part is locked 🔒', 'Unlock it on the plan if you want me to change it'); keep(); render(); },
  setDates(v){ const b=total(); S.dates=v; S.you.dates=true; S.highlight='meter'; toast(v==='late'?'Moved to 26–30 Dec':'Locked in 19–23 Dec', deltaMsg(b)); keep(); render(); },
  setNap(v){ S.nap = v==='yes'; toast(v==='yes'?'Added 2–4 pm rest time on days 1–4':'Afternoons kept open', 'Activities shifted around it'); keep(); render(); },
  skipQ(){ S.qSkipped=true; toast('Skipped. I’ll use my best guesses', 'You can change dates any time from the brief'); keep(); render(); },
  toggleAssume(){ S.assumeOpen=!S.assumeOpen; keep(); render(); },
  assume(k){
    S.assume[k]=!S.assume[k]; S.you['a_'+k]=true;
    const msgs = {lift:['Okay, I’ll stop filtering for lift access','Your current hotel still has one'], conn:['Okay, separate rooms are fine','More hotels open up if you want to compare'], veg:['Noted: no veg filter on restaurants',''], beach:['Okay, beach distance doesn’t matter','Riverside Retreat may suit you better']};
    toast(...(S.assume[k] ? ['Back on: I’ll filter for this again',''] : msgs[k])); keep(); render();
  },
  lock(v){ S.locked[v]=!S.locked[v]; toast(S.locked[v]?`${v==='hotel'?'Hotel':'Flight'} locked 🔒`:`${v==='hotel'?'Hotel':'Flight'} unlocked`, S.locked[v]?'I’ll keep it whatever else changes':''); keep(); render(); },
  openSwap(v){ S.sheet='swap-'+v; keep(); render(); },
  openWhy(v){ S.sheet='why-'+v; keep(); render(); },
  pick(id){
    const isH = S.sheet==='swap-hotel';
    if ((isH && S.locked.hotel) || (!isH && S.locked.flight)) { toast('That part is locked 🔒','Unlock it first to swap'); keep(); render(); return; }
    const before = total(), sp = snap();
    if (isH){ if (id===S.hotel){ S.sheet=null; keep(); render(); return; } S.hotel=id; S.you.hotel = id!=='h1'; S.highlight='hotel';
      toast(`Switched to ${HOTELS[id].name}`, deltaMsg(before)+' · Day 1 check-in updated', sp); }
    else { if (id===S.flight){ S.sheet=null; keep(); render(); return; } S.flight=id; S.you.flight = id!=='f1'; S.highlight='flight';
      toast(`Flight changed to ${FLIGHTS[id].out[0]}`, deltaMsg(before)+' · Day 1 & 5 timings updated', sp); }
    S.sheet=null; keep(); render();
  },
  fixDay3(){ const b=total(), sp=snap(); S.dudhsagar=false; S.highlight='day3'; toast('Day 3 is now a spice farm + pool day', deltaMsg(b), sp); keep(); render(); },
  keepDay3(){ toast('Kept it. I’ll book a jeep with proper seats','You can still change it later'); keep(); render(); },
  cmd(v){
    if (v==='cheaper'){ S.sheet='swap-hotel'; keep(); render(); }
    else if (v==='day3'){ if (S.dudhsagar) A.fixDay3(); else { toast('Day 3 is already an easy day'); keep(); render(); } }
    else if (v==='share') A.openShare();
    else if (v==='pace'){ S.sheet='pace'; keep(); render(); }
  },
  freeText(txt){
    toast(`“${txt}”`, 'Typed requests are simulated here. Try the suggestion chips above'); keep(); render();
  },
  openShare(){ if(S.shared){ A.openRoom(); return; } S.sheet='share'; keep(); render(); },
  sendShare(){ S.sheet=null; S.shared=true; startRoom(); },
  openRoom(){ S.sheet=null; if(S.g) S.roomDark=true; S.screen='room'; if(S.roomStep<0) startRoom(); else { S._roomScroll=true; render(); } },
  join(){ S.screen='join'; render(); },
  gStart(){ gStartFlow(); },
  gBegin(){ S.screen='gq'; S.g.step=0; render(); },
  gBack(){ clearTimers(); if(S.screen==='gq' && S.g.step>0){ S.g.step--; S.g.react=null; S.g.listening=false; render(); } else if(S.screen==='gq'){ S.screen='gwelcome'; render(); } else if(S.screen==='gresult'){ S.screen='gq'; S.g.step=GQ.length-1; render(); } else A.goHome(); },
  gListen(){ if(!S.g.listening && !S.g.react) gListen(); },
  gType(){ S.g.typing=!S.g.typing; render(); setTimeout(()=>document.getElementById('gtype')?.focus(),30); },
  gTypeSend(){ if(GQ[S.g.step].k==='picks') S.g.picks=['beach','pool','fort','shack']; gNext(); },
  gSkip(){ if(!S.g.react) gNext(); },
  gNextBtn(){ if(!S.g.react) gNext(); },
  gWho(v){ if(v==='priya') return; S.g.who[v]=S.g.who[v]?0:1; render(); },
  gDest(v){ S.g.dest=v; render(); if(v!=='goa'){ toast('This prototype follows the Goa trip','Pick Goa to continue'); keep(); render(); return;} later(()=>gNext(),350); },
  gWhen(v){ S.g.when=v; S.dates=v==='ny'?'late':'early'; render(); later(()=>gNext(),350); },
  gBudget(v){ S.g.budget=+v; S.budget=+v; render(); later(()=>gNext(),350); },
  gPace(v){ S.g.pace=v; render(); later(()=>gNext(),350); },
  gPick(v){ const p=S.g.picks; const i=p.indexOf(v); if(i>=0) p.splice(i,1); else p.push(v); S._keepScroll=true; render(); },
  gFull(){ S.screen='plan'; S.qSkipped=true; render(); document.querySelector('.scroll')?.scrollTo(0,0); },
  gInvite(){ S.screen='plan'; S.sheet='share'; render(); },
  gSwapOk(){ S.g.swapAck=true; toast('Kept the easier day','Spice farm + butterfly garden on Day 3'); keep(); render(); },
  gSwapBack(){ S.g.swapAck=true; S.dudhsagar=true; toast('Dudhsagar is back on Day 3','I’ll book a jeep with proper seats for Nanaji'); keep(); render(); },
  joinAs(){ toast('Nani joined the trip room 👵','Back to Priya’s view'); S.screen='room'; S._roomScroll=true; render(); },
  vote(v){ if(S.voted || !ROOM[S.roomStep] || ROOM[S.roomStep].t!=='poll') return; S.voted=v; S._keepScroll=true; render(); roomTick(); },
  toggleBoard(){ S.boardOpen=!S.boardOpen; S._keepScroll=true; render(); },
  roomSkip(){ clearTimers(); const pi=ROOM.findIndex(e=>e.t==='poll'); if(!S.voted&&pi>=0){ S.roomStep=pi; ROOM.slice(0,pi+1).forEach(roomEffect); } else { S.roomStep=ROOM.length-1; ROOM.forEach(roomEffect); S.roomDone=true; } S._roomScroll=true; render(); },
  roomToPlan(){ if(S.roomFrom==='gplan'){ S.roomFrom=null; S.screen='gplan'; render(); return; } if(S.roomFrom==='home'){ S.roomFrom=null; S.screen='home'; render(); return; } if(S.roomDark&&S.g){ S.screen='gresult'; render(); return; } S.screen='plan'; S.highlight='day3'; render(); document.querySelector('.scroll')?.scrollTo(0,0); },
  roomSend(){ toast('Message sent to the group','Clario reads the room and notes what matters'); keep(); render(); },
  applyMom(){ const b=total(), sp=snap(); S.cruise=false; S.momApplied=true; S.highlight='day4'; toast('Day 4 updated for Mummy 💛', deltaMsg(b)+' · she’ll be notified', sp); keep(); render(); },
  dismissMom(){ S.momNote=false; toast('Kept the cruise','I’ll let her know there are seats inside'); keep(); render(); },
  book(){ startBooking(); },
  expert(){ toast('Callback requested 📞', 'Priya from Cleartrip Holidays will call in ~10 min with your plan open (simulated)'); keep(); render(); },
  price(v){
    if (v==='accept'){ S.priceBump=1800; S.sheet=null; render(); continueBooking(); }
    if (v==='switch'){ S.hotel='h2'; S.you.hotel=true; S.sheet=null; render(); continueBooking(); }
    if (v==='hold'){ S.hotelHeld=true; S.sheet=null; render(); continueBooking(); }
  },
  closeSheet(){ S.sheet=null; keep(); render(); },
  undo(){
    if (!S.toast?.undo) return; const o = JSON.parse(S.toast.undo); Object.assign(S, o); S.toast=null;
    toast('Undone', `Total back to ${inr(total())}`); keep(); render();
  },
  restart(){ clearTimers(); S = fresh(); render(); }
};

Object.assign(A, GA);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || !el.dataset.a) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset.v);
});
function autoGrow(ta){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,110)+'px'; }
document.addEventListener('input', e => {
  if (e.target.id==='gbrange'){ e.target.style.setProperty('--p',((+e.target.value-40000)/260000*100).toFixed(1)+'%'); S.g.budget=+e.target.value; S.budget=S.g.budget; const v=document.getElementById('gbval'); if(v) v.textContent=inr(S.g.budget); const pp=document.getElementById('gbpp'); if(pp) pp.textContent=inr(Math.round(S.g.budget/S.g.people.length/100)*100); const hn=document.getElementById('gbhint'); if(hn){ const per=S.g.budget/S.g.people.length; hn.innerHTML=MARK(11,'grad')+' '+(per>=25000?'Comfortable. Room for a lovely stay 👌':per>=15000?'Doable. I’ll pick smart-value stays 💡':'Tight. I’ll look at trains and simpler stays 🧮'); hn.classList.add('on'); } document.querySelectorAll('.gbub').forEach(b=>b.classList.remove('on'));  }
  if (e.target.id==='gfromq'){ S.g.fromQ=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById('gfromq'); if(el){ el.focus(); el.setSelectionRange(pos,pos);} }
  if (e.target.id==='gsearch'){ S.g.q=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById('gsearch'); if(el){ el.focus(); el.setSelectionRange(pos,pos);} }
  if (e.target.id==='draft'){ S.draft=e.target.value; autoGrow(e.target); const b=document.querySelector('.send'); if(b) b.disabled=!S.draft.trim(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id==='draft' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); A.send(); }
  if (e.target.id==='cmd' && e.key==='Enter' && e.target.value.trim()){ A.freeText(e.target.value.trim()); }
  if (e.target.id==='gtype' && e.key==='Enter'){ A.gTypeSend(); }
  if (e.target.id==='ptype' && e.key==='Enter'){ A.pSend(); }
});

  gstay:    ()=>{ S.g=gFresh(); S.g.people=[S.g.people[0],...FAMILY_FROM_VOICE.map(p=>({...p,needs:[...p.needs]}))]; S.screen='gresult'; S.g.sheet='stayh1'; },

  review:   ()=>{ S.screen='review'; S.dudhsagar=false; S.nap=true; S.dates='early'; },
  price:    ()=>{ S.screen='booking'; S.bookStep=1; S.sheet='price'; },
  done:     ()=>{ S.screen='done'; S.dudhsagar=false; },
  room:     ()=>{ S.shared=true; S.screen='room'; S.roomStep=11; ROOM.slice(0,12).forEach(roomEffect); },

  summary:  ()=>{ S.shared=true; S.screen='room'; S.voted='b'; S.roomStep=ROOM.length-1; ROOM.forEach(roomEffect); S.boardOpen=false; },

const shot = new URLSearchParams(location.search).get('shot');
if (shot && SHOTS[shot]){
  document.body.classList.add('capture');
  const target = SHOTS[shot]();
  render();
  if (target){ const sc=document.querySelector('.scroll'), el=document.querySelector(`[data-h="${target}"]`); if(sc&&el) sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 14; }
  if(S.screen==='room'){ const sc=document.querySelector('.scroll'); if(sc) sc.scrollTop=sc.scrollHeight; }
  const tall=new URLSearchParams(location.search).get('tall'); if(tall){ document.querySelector('.phone').style.height=tall+'px'; }
  const open=new URLSearchParams(location.search).get('open'); if(open&&S.g){ if(open==='costs') S.g.costsOpen=true; else S.g.sheet=open; render(); }
} else {
  render();
}
